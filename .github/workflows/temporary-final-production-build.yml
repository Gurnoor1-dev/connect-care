name: Temporary Final Production Build Check

on:
  push:
    branches: [verify/final-consultant-attendance-build]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
